  services:
    data-generator:
      build:
        context: .
        dockerfile: Dockerfile
      image: dirty-data-generator:latest
      environment:
        RECORD_COUNT: ${RECORD_COUNT:-100000}
        DUPLICATE_RATE: ${DUPLICATE_RATE:-0.15}
        BAD_CHAR_RATE: ${BAD_CHAR_RATE:-0.10}
        CORRUPT_NUMERIC_RATE: ${CORRUPT_NUMERIC_RATE:-0.05}
        SEED: ${SEED:-1337}
        BATCH_NAME: ${BATCH_NAME:-batch}
        OUTPUT_DIR: /data/output
      volumes:
        - ${OUTPUT_HOST_PATH:-./output}:/data/output

    ftp-server:
      image: delfer/alpine-ftp-server
      restart: unless-stopped   # this image's pidproxy wrapper occasionally
                                # mis-detects a per-connection child process
                                # exiting as "the service died" and quits;
                                # auto-restart keeps it available for NiFi's polling.
      environment:
        USERS: ${FTP_USER:-nifi}|${FTP_PASSWORD:-nifi_pass}|/home/${FTP_USER:-nifi}/output
        ADDRESS: ${FTP_ADDRESS:-192.168.70.238}
        MIN_PORT: 21000
        MAX_PORT: 21010
      ports:
        - "21:21"
        - "21000-21010:21000-21010"
      volumes:
        - ${OUTPUT_HOST_PATH:-./output}:/home/${FTP_USER:-nifi}/output

    nifi:
      image: apache/nifi:1.23.2
      container_name: nifi
      ports:
        - "8443:8443"
      environment:
        - NIFI_WEB_HTTPS_PORT=8443
        - NIFI_WEB_HTTPS_HOST=0.0.0.0
        - NIFI_WEB_PROXY_HOST=192.168.70.238:8443
        - NIFI_JVM_HEAP_INIT=2g
        - NIFI_JVM_HEAP_MAX=4g
        - OIDC_CLIENT_SECRET=${CLIENT_SECRET}
        - AZURE_TENANT_ID=${OIDC_TENANT_ID}
        - AZURE_CLIENT_ID=${OIDC_CLIENT_ID}
        - NIFI_REMOTE_INPUT_SECURE=false 
      entrypoint: >
        /bin/sh -c '
        cp /opt/nifi/custom-conf/nifi.properties /opt/nifi/nifi-current/conf/nifi.properties;
        cp /opt/nifi/custom-conf/authorizers.xml /opt/nifi/nifi-current/conf/authorizers.xml;
        cp /opt/nifi/custom-conf/keystore.jks /opt/nifi/nifi-current/conf/keystore.jks;
        cp /opt/nifi/custom-conf/truststore.jks /opt/nifi/nifi-current/conf/truststore.jks;
        cp /opt/nifi/custom-conf/flow.json.gz /opt/nifi/nifi-current/conf/flow.json.gz;
        cp /opt/nifi/custom-conf/logback.xml /opt/nifi/nifi-current/conf/logback.xml;
        sed -i "s|OIDC_DISCOVERY_URL|https://login.microsoftonline.com/$$AZURE_TENANT_ID/v2.0/.well-known/openid-configuration|g" /opt/nifi/nifi-current/conf/nifi.properties;
        sed -i "s|OIDC_CLIENT_ID|$$AZURE_CLIENT_ID|g" /opt/nifi/nifi-current/conf/nifi.properties;
        sed -i "s|OIDC_CLIENT_SECRET|$$OIDC_CLIENT_SECRET|g" /opt/nifi/nifi-current/conf/nifi.properties;
        exec ../scripts/start.sh
        '
      volumes:
        - nifi-conf:/opt/nifi/nifi-current/conf
        - nifi-content:/opt/nifi/nifi-current/content_repository
        - nifi-database:/opt/nifi/nifi-current/database_repository
        - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
        - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
        - ${OUTPUT_HOST_PATH:-./output}:/opt/nifi/test-data
        - ./drivers:/opt/nifi/drivers
        - ./nifi.properties:/opt/nifi/custom-conf/nifi.properties
        - ./authorizers.xml:/opt/nifi/custom-conf/authorizers.xml
        - ./keystore.jks:/opt/nifi/custom-conf/keystore.jks
        - ./truststore.jks:/opt/nifi/custom-conf/truststore.jks
        - nifi-logs:/opt/nifi/nifi-current/logs
        - ./flow.json.gz:/opt/nifi/custom-conf/flow.json.gz
        - ./logback.xml:/opt/nifi/custom-conf/logback.xml
        
    minio:
      image: minio/minio:latest
      container_name: minio
      ports:
        - "9000:9000"   # S3 API - what NiFi's PutS3Object processors talk to
        - "9001:9001"   # Web console - browse buckets at http://localhost:9001
      environment:
        MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      command: server /data --console-address ":9001"
      volumes:
        - minio-data:/data

    createbuckets:
      image: minio/mc
      depends_on:
        - minio
      volumes:
        - ./minio-policies:/policies:ro
      environment:
        MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
        MINIO_DEV_USER: ${MINIO_DEV_USER:-datadev}
        MINIO_DEV_PASSWORD: ${MINIO_DEV_PASSWORD:-devpass123}
        MINIO_AUDIT_USER: ${MINIO_AUDIT_USER:-opaudit}
        MINIO_AUDIT_PASSWORD: ${MINIO_AUDIT_PASSWORD:-auditpass123}
      entrypoint: |
        /bin/sh -c "
        echo 'Waiting for MinIO...'
        until mc alias set local-minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          sleep 1
        done

        echo 'Creating buckets...'
        mc mb --ignore-existing local-minio/raw
        mc mb --ignore-existing local-minio/cleansed
        mc mb --ignore-existing local-minio/quarantine

        echo 'Importing policies...'
        mc admin policy create local-minio data-developer-policy /policies/data-developer-policy.json || true
        mc admin policy create local-minio operations-auditor-policy /policies/operations-auditor-policy.json || true

        echo 'Configuring users...'
        mc admin user add local-minio $$MINIO_DEV_USER $$MINIO_DEV_PASSWORD || true
        mc admin user add local-minio $$MINIO_AUDIT_USER $$MINIO_AUDIT_PASSWORD || true

        echo 'Attaching policies to users...'
        mc admin policy attach local-minio data-developer-policy --user $$MINIO_DEV_USER
        mc admin policy attach local-minio operations-auditor-policy --user $$MINIO_AUDIT_USER

        echo 'MinIO initialization complete!'
        "

    postgres:
      image: postgres:15
      container_name: nifi-postgres
      restart: unless-stopped
      environment:
        POSTGRES_USER: nifi_admin
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: nifi_dw
      ports:
        - "5433:5432"
      volumes:
        - pg_data:/var/lib/postgresql/data

    elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
      container_name: elasticsearch
      environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      ports:
      - "9200:9200"
      volumes:
      - es-data:/usr/share/elasticsearch/data

    elastic-init:
      image: curlimages/curl:latest
      depends_on:
        - elasticsearch
      environment:
        ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
        ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      entrypoint: >
        /bin/sh -c '
        echo "Waiting for Elasticsearch...";
        until curl -s -u elastic:$$ELASTIC_PASSWORD http://elasticsearch:9200 >/dev/null; do
          sleep 2;
        done;

        echo "Setting kibana_system password...";

        curl -X POST \
          -u elastic:$$ELASTIC_PASSWORD \
          -H "Content-Type: application/json" \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -d "{\"password\":\"$$ELASTICSEARCH_PASSWORD\"}";

        echo "Elasticsearch initialization complete!";
        '
      
    kibana:
      image: docker.elastic.co/kibana/kibana:8.15.0
      container_name: kibana
      ports:
      - "5601:5601"
      environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      depends_on:
      - elasticsearch
      - elastic-init
  
    filebeat:
      image: docker.elastic.co/beats/filebeat:8.15.0
      container_name: filebeat
      user: root
      command: ["--strict.perms=false"]
      volumes:
      - nifi-logs:/var/log/nifi:ro
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      depends_on:
      - elasticsearch

  volumes:
    nifi-conf:
    nifi-content:
    nifi-database:
    nifi-flowfile:
    nifi-provenance:
    minio-data:
    pg_data:
    nifi-logs:    
    es-data:
