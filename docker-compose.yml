  x-logging: &default-logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  services:
    data-generator:
      <<: *default-logging
      build:
        context: .
        dockerfile: Dockerfile
      image: dirty-data-generator:latest
      environment:
        RECORD_COUNT: ${RECORD_COUNT:-100000}
        DUPLICATE_RATE: ${DUPLICATE_RATE:-0.15}
        BAD_CHAR_RATE: ${BAD_CHAR_RATE:-0.10}
        CORRUPT_NUMERIC_RATE: ${CORRUPT_NUMERIC_RATE:-0.05}
        SEED: ${SEED:-1337}
        BATCH_NAME: ${BATCH_NAME:-batch}
        OUTPUT_DIR: /data/output
      volumes:
        - ${OUTPUT_HOST_PATH:-./output}:/data/output
      networks:
        - pipeline-net

    ftp-server:
      <<: *default-logging
      image: delfer/alpine-ftp-server
      container_name: ftp-server
      restart: unless-stopped
      environment:
        USERS: ${FTP_USER:-nifi}|${FTP_PASSWORD:-nifi_pass}|/home/${FTP_USER:-nifi}/output
        ADDRESS: ${FTP_ADDRESS:-192.168.70.238}
        MIN_PORT: 21000
        MAX_PORT: 21010
      ports:
        - "21:21"
        - "21000-21010:21000-21010"
      volumes:
        - ${OUTPUT_HOST_PATH:-./output}:/home/${FTP_USER:-nifi}/output
      networks:
        - pipeline-net

    nifi:
      <<: *default-logging
      image: apache/nifi:1.23.2
      container_name: nifi
      restart: unless-stopped
      ports:
        - "8443:8443"
      environment:
        - NIFI_WEB_HTTPS_PORT=8443
        - NIFI_WEB_HTTPS_HOST=0.0.0.0
        - NIFI_WEB_PROXY_HOST=${FTP_ADDRESS:-192.168.70.238}:8443
        - NIFI_JVM_HEAP_INIT=2g
        - NIFI_JVM_HEAP_MAX=4g
        - OIDC_CLIENT_SECRET=${CLIENT_SECRET}
        - AZURE_TENANT_ID=${OIDC_TENANT_ID}
        - AZURE_CLIENT_ID=${OIDC_CLIENT_ID}
        - NIFI_REMOTE_INPUT_SECURE=false
      entrypoint: /bin/sh /opt/nifi/custom-conf/nifi-init.sh
      volumes:
        - nifi-conf:/opt/nifi/nifi-current/conf
        - nifi-content:/opt/nifi/nifi-current/content_repository
        - nifi-database:/opt/nifi/nifi-current/database_repository
        - nifi-flowfile:/opt/nifi/nifi-current/flowfile_repository
        - nifi-provenance:/opt/nifi/nifi-current/provenance_repository
        - ${OUTPUT_HOST_PATH:-./output}:/opt/nifi/test-data
        - ./drivers:/opt/nifi/drivers
        - ./nifi.properties:/opt/nifi/custom-conf/nifi.properties
        - ./authorizers.xml:/opt/nifi/custom-conf/authorizers.xml
        - ./keystore.jks:/opt/nifi/custom-conf/keystore.jks
        - ./truststore.jks:/opt/nifi/custom-conf/truststore.jks
        - nifi-logs:/opt/nifi/nifi-current/logs
        - ./flow.json.gz:/opt/nifi/custom-conf/flow.json.gz
        - ./logback.xml:/opt/nifi/custom-conf/logback.xml
        - ./scripts/nifi-init.sh:/opt/nifi/custom-conf/nifi-init.sh:ro
      depends_on:
        postgres:
          condition: service_healthy
      networks:
        - pipeline-net

    minio:
      <<: *default-logging
      image: minio/minio:latest
      container_name: minio
      restart: unless-stopped
      ports:
        - "9000:9000"
        - "9001:9001"
      environment:
        MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      command: server /data --console-address ":9001"
      volumes:
        - minio-data:/data
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
        interval: 5s
        timeout: 5s
        retries: 5
      networks:
        - pipeline-net

    createbuckets:
      <<: *default-logging
      image: minio/mc
      depends_on:
        minio:
          condition: service_healthy
      volumes:
        - ./minio-policies:/policies:ro
        - ./scripts/minio-init.sh:/usr/local/bin/minio-init.sh:ro
      environment:
        MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
        MINIO_DEV_USER: ${MINIO_DEV_USER:-dev-user}
        MINIO_DEV_PASSWORD: ${MINIO_DEV_PASSWORD:-dev-user-123}
        MINIO_AUDIT_USER: ${MINIO_AUDIT_USER:-auditor-user}
        MINIO_AUDIT_PASSWORD: ${MINIO_AUDIT_PASSWORD:-auditor-user-123}
      entrypoint: /bin/sh /usr/local/bin/minio-init.sh
      networks:
        - pipeline-net

    postgres:
      <<: *default-logging
      image: postgres:15
      container_name: nifi-postgres
      restart: unless-stopped
      environment:
        POSTGRES_USER: nifi_admin
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: nifi_dw
      ports:
        - "5433:5432"
      volumes:
        - pg_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U nifi_admin -d nifi_dw"]
        interval: 5s
        timeout: 5s
        retries: 5
      networks:
        - pipeline-net

    elasticsearch:
      <<: *default-logging
      image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
      container_name: elasticsearch
      restart: unless-stopped
      environment:
        - discovery.type=single-node
        - xpack.security.enabled=true
        - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      ports:
        - "9200:9200"
      volumes:
        - es-data:/usr/share/elasticsearch/data
      healthcheck:
        test: ["CMD-SHELL", "curl -s http://localhost:9200/ || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - pipeline-net

    kibana:
      <<: *default-logging
      image: docker.elastic.co/kibana/kibana:8.15.0
      container_name: kibana
      restart: unless-stopped
      ports:
        - "5601:5601"
      environment:
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
        - ELASTICSEARCH_USERNAME=kibana_system
        - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      depends_on:
        elasticsearch:
          condition: service_healthy
      networks:
        - pipeline-net

    filebeat:
      <<: *default-logging
      image: docker.elastic.co/beats/filebeat:8.15.0
      container_name: filebeat
      restart: unless-stopped
      user: root
      command: ["--strict.perms=false"]
      volumes:
        - nifi-logs:/var/log/nifi:ro
        - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      depends_on:
        elasticsearch:
          condition: service_healthy
      networks:
        - pipeline-net

  volumes:
    nifi-conf:
    nifi-content:
    nifi-database:
    nifi-flowfile:
    nifi-provenance:
    minio-data:
    pg_data:
    nifi-logs:    
    es-data:

  networks:
    pipeline-net:
      driver: bridge
